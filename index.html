<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>codetbase Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; }

    .card { background: #1e293b; padding: 2.5rem; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; border: 1px solid #334155; }

    #dashboard { display: none; width: 100%; max-width: 1200px; min-height: 100vh; padding: 20px; flex-direction: column; }

    h2 { margin-bottom: 1.5rem; color: #38bdf8; font-size: 1.6rem; }
    .badge { display: inline-block; padding: 4px 10px; background: #0284c7; color: #fff; font-size: 0.75rem; border-radius: 20px; margin-bottom: 1rem; }
    .badge.admin { background: #e11d48; }

    .input-group { margin-bottom: 1rem; text-align: left; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.4rem; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.95rem; outline: none; }
    input:focus { border-color: #38bdf8; }

    button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #0284c7; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 0.5rem; }
    button:hover { background: #0369a1; }
    button.secondary { background: #475569; }
    button.secondary:hover { background: #334155; }
    button.danger { background: #ef4444; }
    button.danger:hover { background: #dc2626; }

    a.admin-link { display: inline-block; margin-top: 8px; font-size: 0.8rem; color: #fca5a5; text-decoration: none; }
    a.admin-link:hover { text-decoration: underline; }

    .hidden { display: none !important; }
    .info-text { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.4; }

    .dash-header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 20px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .nav-tabs button { width: auto; padding: 8px 16px; font-size: 0.9rem; background: #334155; }
    .nav-tabs button.active { background: #0284c7; }

    /* 그룹 바 */
    .group-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px 16px; margin-bottom: 20px; }
    .group-bar .group-label { color: #94a3b8; font-size: 0.85rem; white-space: nowrap; }
    .group-btn { width: auto; padding: 6px 14px; font-size: 0.85rem; margin-top: 0; background: #334155; }
    .group-btn.active-group { background: #0284c7; }
    .current-group-text { color: #38bdf8; font-size: 0.85rem; font-weight: bold; margin-left: auto; }

    .modal-meta { text-align: left; background: #0f172a; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 0.85rem; color: #cbd5e1; line-height: 1.6; }
    .modal-meta a { color: #38bdf8; }

    /* 업로드 박스 및 프로그레스 바 */
    .upload-box { background: #1e293b; padding: 20px; border-radius: 12px; border: 2px dashed #334155; text-align: center; margin-bottom: 20px; }
    .progress-container { width: 100%; background: #0f172a; border-radius: 8px; overflow: hidden; margin-top: 10px; height: 14px; display: none; }
    .progress-bar { width: 0%; height: 100%; background: #38bdf8; transition: width 0.1s; }

    /* 스마트폰 갤러리형 그리드 */
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .gallery-item { background: #1e293b; border-radius: 10px; overflow: hidden; border: 1px solid #334155; position: relative; cursor: pointer; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
    .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }
    .gallery-item .file-badge { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.7); font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; color: #fff; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 폴더 보기 그리드 */
    .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .folder-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; }
    .folder-card:hover { border-color: #38bdf8; transform: translateY(-3px); }
    .folder-card span { font-size: 2.5rem; display: block; margin-bottom: 10px; }

    /* 모달 팝업 */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-content { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 500px; width: 100%; border: 1px solid #334155; text-align: center; position: relative; }
    .modal-content img, .modal-content video { max-width: 100%; max-height: 60vh; border-radius: 8px; margin-bottom: 15px; }
    .modal-close { position: absolute; top: 10px; right: 15px; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; width: auto; padding: 0; }
  </style>
</head>
<body>

  <div class="card" id="loginCard">
    <h2>codetbase</h2>
    <p class="info-text">아이디와 비밀번호를 입력하여 로그인하세요.</p>
    <div class="input-group">
      <label>아이디</label>
      <input type="text" id="loginId" placeholder="예: user1">
    </div>
    <div class="input-group">
      <label>비밀번호</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button onclick="login()">로그인</button>
  </div>

  <div id="dashboard">
    <div class="dash-header">
      <div>
        <span class="badge" id="roleBadge">일반 사용자</span>
        <h3 id="welcomeText" style="font-size: 1.1rem; margin-top: 5px;">환영합니다</h3>
        <a href="admin.html" class="admin-link hidden" id="adminLink">👑 관리자 페이지로 이동 →</a>
      </div>
      <button class="secondary" style="width: auto; padding: 8px 16px;" onclick="logout()">로그아웃</button>
    </div>

    <div class="group-bar" id="groupBar">
      <span class="group-label">소속 그룹:</span>
      <div id="groupButtons" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
      <span class="current-group-text" id="currentGroupLabel"></span>
    </div>

    <div class="nav-tabs">
      <button id="tabAll" class="active" onclick="switchTab('all')">전체 파일 보기</button>
      <button id="tabFolders" onclick="switchTab('folders')">폴더별 보기</button>
    </div>

    <div class="upload-box">
      <p style="margin-bottom: 10px; color: #94a3b8; font-size: 0.9rem;">스마트폰 저장소로 보낼 파일을 선택하세요.</p>
      <input type="file" id="fileInput" style="display: none;" onchange="uploadFile()">
      <button onclick="document.getElementById('fileInput').click()" style="max-width: 200px; margin: 0 auto;">파일 선택 및 업로드</button>
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div id="allFilesView">
      <div class="gallery-grid" id="galleryGrid"></div>
      <button id="loadMoreBtn" class="secondary" style="margin-top: 20px;" onclick="loadMoreFiles()">사진 더보기 +20</button>
    </div>

    <div id="foldersView" class="hidden">
      <div class="folder-grid" id="folderGrid"></div>
    </div>

    <div id="folderDetailView" class="hidden">
      <button class="secondary" style="width: auto; margin-bottom: 15px; padding: 6px 12px;" onclick="backToFolders()">← 폴더 목록으로</button>
      <h3 id="currentFolderName" style="margin-bottom: 15px; color: #38bdf8;"></h3>
      <div class="gallery-grid" id="folderGalleryGrid"></div>
    </div>
  </div>

  <div class="modal" id="fileModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModalDirect()">×</button>
      <div id="modalMediaContainer"></div>
      <p id="modalUploader" style="margin: 10px 0; font-size: 0.9rem; color: #94a3b8;"></p>
      <div class="modal-meta" id="modalMeta"></div>
      <div style="display: flex; gap: 10px;">
        <button id="modalDownloadBtn" style="flex: 1;" onclick="downloadCurrentFile()">저장 / 다운로드</button>
        <button id="modalDeleteBtn" class="danger hidden" onclick="deleteCurrentFile()" style="flex: 1;">삭제</button>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, limit, startAfter, where
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import * as exifr from "https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.esm.mjs";

  // ⚠️ 이 파일(index.html)은 일반 사용자용입니다.
  // 계정 발급 / 그룹 생성-수정 / 서버 상태 확인 같은 관리자 기능은 여기 전혀 없습니다.
  // 그런 기능은 admin.html 에서만 다룹니다.

  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCZiMuJmza3qBfzp-QLaLxolgFIXZPSUzU",
    authDomain: "codetbase-3afea.firebaseapp.com",
    projectId: "codetbase-3afea",
    storageBucket: "codetbase-3afea.firebasestorage.app",
    messagingSenderId: "560932432321",
    appId: "1:560932432321:web:94f0df7f19afa1db8d2740",
    measurementId: "G-EV5HXEE221"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 스마트폰 연결 주소 (Localtonet / Cloudflare Tunnel)
  const PHONE_SERVER_URL = "https://apparent-evening-when-exec.trycloudflare.com";

  const DOMAIN = "@codetbase.com";
  const ADMIN_EMAILS = ["admin@codetbase.com", "admin"];

  let currentUser = null;
  let currentUserId = null;
  let isAdminGlobal = false; // 관리자 계정이면 파일을 그룹 구분 없이 전체 볼 수 있게 하기 위한 용도로만 사용 (관리 기능 아님)
  let allFilesData = [];
  let currentModalFile = null;
  let lastVisibleDoc = null;
  const PAGE_SIZE = 20;

  // 그룹 관련 상태
  let userGroups = [];       // 현재 로그인한 사용자가 소속된 그룹 목록
  let selectedGroup = null;  // 현재 화면에 선택되어 보여지고 있는 그룹

  // 로그인
  window.login = async () => {
    const rawId = document.getElementById('loginId').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    if (!rawId || !password) return alert("아이디와 비밀번호를 입력해주세요.");
    const email = rawId.includes('@') ? rawId : rawId + DOMAIN;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      alert("로그인 실패: 아이디 또는 비밀번호를 확인하세요.");
    }
  };

  window.logout = () => signOut(auth);

  // 로그인 상태 세션 관리
  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    if (user) {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      const userId = user.email.split('@')[0];
      currentUserId = userId;
      const isAdmin = ADMIN_EMAILS.includes(user.email) || ADMIN_EMAILS.includes(userId);
      isAdminGlobal = isAdmin;

      const badge = document.getElementById('roleBadge');
      if (isAdmin) {
        badge.innerText = "관리자";
        badge.className = "badge admin";
        document.getElementById('adminLink').classList.remove('hidden');
      } else {
        badge.innerText = "일반 사용자";
        badge.className = "badge";
        document.getElementById('adminLink').classList.add('hidden');
      }
      document.getElementById('welcomeText').innerText = `${userId} 님 환영합니다.`;
      await loadUserGroups(userId);
      loadInitialFiles();
    } else {
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
    }
  });

  // 사용자가 소속된 그룹 불러오기
  async function loadUserGroups(userId) {
    const q = query(collection(db, "groups"), where("members", "array-contains", userId));
    const snap = await getDocs(q);
    userGroups = [];
    snap.forEach(d => userGroups.push({ id: d.id, ...d.data() }));

    selectedGroup = userGroups.length > 0 ? userGroups[0] : null;
    updateCurrentGroupLabel();
    renderGroupTabs();
  }

  function updateCurrentGroupLabel() {
    const label = document.getElementById('currentGroupLabel');
    if (selectedGroup) {
      label.innerText = `현재 그룹: ${selectedGroup.name}`;
    } else {
      label.innerText = isAdminGlobal ? `현재 그룹: 전체 (관리자)` : `현재 그룹: 없음 (내 파일만 표시)`;
    }
  }

  function renderGroupTabs() {
    const container = document.getElementById('groupButtons');
    container.innerHTML = '';
    if (userGroups.length === 0) {
      const span = document.createElement('span');
      span.style.cssText = 'color:#64748b; font-size:0.85rem;';
      span.innerText = isAdminGlobal ? '관리자는 모든 파일을 볼 수 있습니다.' : '소속된 그룹이 없습니다 (내가 올린 파일만 표시됩니다)';
      container.appendChild(span);
      return;
    }
    userGroups.forEach(g => {
      const btn = document.createElement('button');
      btn.className = 'group-btn' + (selectedGroup && selectedGroup.id === g.id ? ' active-group' : '');
      btn.innerText = g.name;
      btn.onclick = () => selectGroup(g);
      container.appendChild(btn);
    });
  }

  window.selectGroup = (g) => {
    selectedGroup = g;
    updateCurrentGroupLabel();
    renderGroupTabs();
    loadInitialFiles();
    if (!document.getElementById('foldersView').classList.contains('hidden')) {
      loadFolders();
    }
  };

  // 사진 파일에서 촬영 기기(Make/Model)와 GPS 위치 정보를 읽어옴 (없으면 null)
  async function extractPhotoMeta(file) {
    let device = null;
    let gps = null;
    if (file.type && file.type.startsWith('image/')) {
      try {
        const data = await exifr.parse(file, { gps: true, tiff: true, ifd0: true });
        if (data) {
          const make = data.Make ? data.Make.trim() : '';
          const model = data.Model ? data.Model.trim() : '';
          const combined = `${make} ${model}`.trim();
          if (combined) device = combined;
          if (typeof data.latitude === 'number' && typeof data.longitude === 'number') {
            gps = { lat: data.latitude, lng: data.longitude };
          }
        }
      } catch (e) {
        console.warn('EXIF 정보를 읽을 수 없습니다:', e);
      }
    }
    return { device, gps };
  }

  // 스마트폰 저장소(shttps)로 직접 파일 업로드
  window.uploadFile = async () => {
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append('file', file);

    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    progressContainer.style.display = 'block';
    progressBar.style.width = '15%';

    // 사진에서 촬영 기기 / 위치 정보(EXIF) 추출
    const photoMeta = await extractPhotoMeta(file);
    progressBar.style.width = '30%';

    try {
      const response = await fetch(`${PHONE_SERVER_URL}/upload`, {
        method: 'POST',
        body: formData
      });

      if (!response.ok) {
        throw new Error(`서버 응답 코드 ${response.status}`);
      }

      const result = await response.json();
      const savedName = result.name;
      const fileUrl = `${PHONE_SERVER_URL}/files/${encodeURIComponent(savedName)}`;

      progressBar.style.width = '100%';

      await addDoc(collection(db, "files"), {
        name: savedName,
        url: fileUrl,
        uploader: currentUser.email.split('@')[0],
        group: selectedGroup ? selectedGroup.id : null,
        device: photoMeta.device,
        gps: photoMeta.gps,
        createdAt: Date.now()
      });

      alert("스마트폰 저장소로 파일 업로드가 완료되었습니다!");
      loadInitialFiles();
    } catch (error) {
      alert(`스마트폰 서버 전송 실패 (${error.message}). Termux에서 python server.py 창이 켜져 있는지, 터널이 켜져 있는지 확인하세요.`);
    } finally {
      setTimeout(() => {
        progressContainer.style.display = 'none';
        progressBar.style.width = '0%';
        fileInput.value = '';
      }, 500);
    }
  };

  // 현재 상태(관리자 / 선택된 그룹 / 그룹 없음)에 맞는 파일 목록 쿼리를 구성
  function buildFilesQuery(afterDoc) {
    const base = collection(db, "files");
    if (isAdminGlobal) {
      return afterDoc
        ? query(base, orderBy("createdAt", "desc"), startAfter(afterDoc), limit(PAGE_SIZE))
        : query(base, orderBy("createdAt", "desc"), limit(PAGE_SIZE));
    } else if (selectedGroup) {
      return afterDoc
        ? query(base, where("group", "==", selectedGroup.id), orderBy("createdAt", "desc"), startAfter(afterDoc), limit(PAGE_SIZE))
        : query(base, where("group", "==", selectedGroup.id), orderBy("createdAt", "desc"), limit(PAGE_SIZE));
    } else {
      return afterDoc
        ? query(base, where("uploader", "==", currentUserId), orderBy("createdAt", "desc"), startAfter(afterDoc), limit(PAGE_SIZE))
        : query(base, where("uploader", "==", currentUserId), orderBy("createdAt", "desc"), limit(PAGE_SIZE));
    }
  }

  async function loadInitialFiles() {
    const q = buildFilesQuery(null);
    const querySnapshot = await getDocs(q);
    allFilesData = [];
    querySnapshot.forEach((docSnap) => {
      allFilesData.push({ id: docSnap.id, ...docSnap.data() });
    });
    lastVisibleDoc = querySnapshot.docs[querySnapshot.docs.length - 1] || null;
    renderGallery(allFilesData, 'galleryGrid');
  }

  window.loadMoreFiles = async () => {
    if (!lastVisibleDoc) return alert("더 이상 불러올 파일이 없습니다.");
    const q = buildFilesQuery(lastVisibleDoc);
    const querySnapshot = await getDocs(q);
    if (querySnapshot.empty) {
      alert("모든 파일을 불러왔습니다.");
      return;
    }
    querySnapshot.forEach((docSnap) => {
      allFilesData.push({ id: docSnap.id, ...docSnap.data() });
    });
    lastVisibleDoc = querySnapshot.docs[querySnapshot.docs.length - 1] || null;
    renderGallery(allFilesData, 'galleryGrid');
  };

  // 갤러리 그리드 출력
  function renderGallery(files, elementId) {
    const grid = document.getElementById(elementId);
    grid.innerHTML = '';
    files.forEach(file => {
      const item = document.createElement('div');
      item.className = 'gallery-item';

      const isVideo = file.name.match(/\.(mp4|webm|ogg|mov)$/i);
      if (isVideo) {
        item.innerHTML = `<video src="${file.url}"></video><div class="file-badge">${file.name}</div>`;
      } else {
        item.innerHTML = `<img src="${file.url}" loading="lazy"><div class="file-badge">${file.name}</div>`;
      }
      item.onclick = () => openModal(file);
      grid.appendChild(item);
    });
  }

  // 모달 팝업
  function openModal(file) {
    currentModalFile = file;
    const isVideo = file.name.match(/\.(mp4|webm|ogg|mov)$/i);
    const container = document.getElementById('modalMediaContainer');
    container.innerHTML = isVideo ? `<video src="${file.url}" controls autoplay></video>` : `<img src="${file.url}">`;

    document.getElementById('modalUploader').innerText = `올린 사람: ${file.uploader}`;

    const deviceText = file.device ? file.device : '기기 정보 없음';
    const gpsText = (file.gps && typeof file.gps.lat === 'number')
      ? `위도 ${file.gps.lat.toFixed(5)}, 경도 ${file.gps.lng.toFixed(5)} — <a href="https://maps.google.com/?q=${file.gps.lat},${file.gps.lng}" target="_blank" rel="noopener">지도에서 보기</a>`
      : '위치 정보 없음';
    document.getElementById('modalMeta').innerHTML = `
      📷 촬영 기기: ${deviceText}<br>
      📍 촬영 위치: ${gpsText}
    `;

    const userId = currentUser.email.split('@')[0];
    const isAdmin = ADMIN_EMAILS.includes(currentUser.email) || ADMIN_EMAILS.includes(userId);

    const deleteBtn = document.getElementById('modalDeleteBtn');
    if (file.uploader === userId || isAdmin) {
      deleteBtn.classList.remove('hidden');
    } else {
      deleteBtn.classList.add('hidden');
    }

    document.getElementById('fileModal').style.display = 'flex';
  }

  // 다운로드 버튼: 모바일에서는 공유 시트(사진 앱에 저장 가능)를, 컴퓨터에서는 파일로 저장을 시도
  window.downloadCurrentFile = () => {
    if (!currentModalFile) return;
    smartDownload(currentModalFile.url, currentModalFile.name);
  };

  async function smartDownload(url, filename) {
    try {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`파일을 불러올 수 없습니다 (${resp.status})`);
      const blob = await resp.blob();
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (isMobile && navigator.canShare) {
        try {
          const fileObj = new File([blob], filename, { type: blob.type });
          if (navigator.canShare({ files: [fileObj] })) {
            await navigator.share({ files: [fileObj] });
            return; // 공유 시트에서 "사진 앱에 저장"을 선택하면 갤러리에 저장됨
          }
        } catch (shareErr) {
          if (shareErr && shareErr.name === 'AbortError') return;
        }
      }

      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
    } catch (e) {
      alert('저장 실패: ' + e.message);
    }
  }

  window.closeModalDirect = () => { document.getElementById('fileModal').style.display = 'none'; };
  window.closeModal = (e) => { if (e.target.id === 'fileModal') closeModalDirect(); };

  // 삭제 기능
  window.deleteCurrentFile = async () => {
    if (!confirm("정말 삭제하시겠습니까?")) return;
    try {
      await deleteDoc(doc(db, "files", currentModalFile.id));
      closeModalDirect();
      loadInitialFiles();
    } catch (e) {
      alert("삭제 실패: " + e.message);
    }
  };

  // 탭 전환
  window.switchTab = (tab) => {
    document.getElementById('tabAll').classList.remove('active');
    document.getElementById('tabFolders').classList.remove('active');
    document.getElementById('allFilesView').classList.add('hidden');
    document.getElementById('foldersView').classList.add('hidden');
    document.getElementById('folderDetailView').classList.add('hidden');

    if (tab === 'all') {
      document.getElementById('tabAll').classList.add('active');
      document.getElementById('allFilesView').classList.remove('hidden');
    } else if (tab === 'folders') {
      document.getElementById('tabFolders').classList.add('active');
      document.getElementById('foldersView').classList.remove('hidden');
      loadFolders();
    }
  };

  // 폴더별 보기 (관리자: 전체 업로더 / 일반 사용자: 현재 선택된 그룹 소속 계정만)
  async function loadFolders() {
    let uploaders = new Set();

    if (isAdminGlobal) {
      const querySnapshot = await getDocs(collection(db, "files"));
      querySnapshot.forEach(docSnap => {
        const data = docSnap.data();
        if (data.uploader) uploaders.add(data.uploader);
      });
    } else if (selectedGroup) {
      uploaders = new Set(selectedGroup.members || []);
    } else {
      uploaders = new Set([currentUserId]);
    }

    const folderGrid = document.getElementById('folderGrid');
    folderGrid.innerHTML = '';

    if (uploaders.size === 0) {
      folderGrid.innerHTML = '<p style="color:#94a3b8; grid-column: 1/-1; text-align: center;">업로드된 폴더가 없습니다.</p>';
      return;
    }

    uploaders.forEach(user => {
      const card = document.createElement('div');
      card.className = 'folder-card';
      card.innerHTML = `<span>📁</span><strong>${user}</strong>`;
      card.onclick = () => openFolder(user);
      folderGrid.appendChild(card);
    });
  }

  async function openFolder(username) {
    document.getElementById('foldersView').classList.add('hidden');
    document.getElementById('folderDetailView').classList.remove('hidden');
    document.getElementById('currentFolderName').innerText = `📁 ${username} 님의 폴더`;

    const constraints = [where("uploader", "==", username)];
    if (!isAdminGlobal && selectedGroup) {
      constraints.push(where("group", "==", selectedGroup.id));
    }
    const q = query(collection(db, "files"), ...constraints);
    const querySnapshot = await getDocs(q);
    const userFiles = [];
    querySnapshot.forEach(docSnap => {
      userFiles.push({ id: docSnap.id, ...docSnap.data() });
    });
    renderGallery(userFiles, 'folderGalleryGrid');
  }

  window.backToFolders = () => {
    document.getElementById('folderDetailView').classList.add('hidden');
    document.getElementById('foldersView').classList.remove('hidden');
  };
</script>

</body>
</html>
