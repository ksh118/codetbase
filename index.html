<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>codetbase Portal</title>
  <style>
    :root {
      --bg: #191919;
      --bg-raised: #202020;
      --bg-hover: #2a2a2a;
      --bg-input: #252525;
      --border: #2f2f2f;
      --border-soft: #272727;
      --text: #e9e9e7;
      --text-muted: #9b9b9b;
      --text-faint: #6b6b6b;
      --accent: #529cca;
      --accent-soft: rgba(82, 156, 202, 0.14);
      --accent-text: #7cb8dd;
      --danger: #e2685f;
      --danger-soft: rgba(226, 104, 95, 0.14);
      --admin: #d99a4e;
      --admin-soft: rgba(217, 154, 78, 0.14);
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* 로그인 카드 */
    .card {
      background: var(--bg-raised);
      padding: 2.25rem 2rem;
      border-radius: var(--r-lg);
      width: 100%;
      max-width: 380px;
      border: 1px solid var(--border);
      text-align: left;
    }
    .card h2 { text-align: left; }

    #dashboard { display: none; width: 100%; max-width: 880px; min-height: 100vh; padding: 20px 16px 60px; flex-direction: column; }

    h2 { margin-bottom: 0.4rem; color: var(--text); font-size: 1.3rem; font-weight: 600; letter-spacing: -0.01em; }
    .badge { display: inline-block; padding: 3px 10px; background: var(--accent-soft); color: var(--accent-text); font-size: 0.72rem; font-weight: 500; border-radius: 20px; margin-bottom: 0.75rem; }
    .badge.admin { background: var(--admin-soft); color: var(--admin); }

    .input-group { margin-bottom: 0.9rem; text-align: left; }
    label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 0.35rem; }
    input {
      width: 100%; padding: 10px 12px; border-radius: var(--r-sm);
      border: 1px solid var(--border); background: var(--bg-input);
      color: var(--text); font-size: 0.9rem; outline: none; transition: border-color 0.15s;
    }
    input::placeholder { color: var(--text-faint); }
    input:focus { border-color: var(--accent); }

    button {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--r-sm);
      background: var(--bg-raised); color: var(--text); font-size: 0.88rem; font-weight: 500;
      cursor: pointer; transition: background 0.15s, border-color 0.15s; margin-top: 0.5rem;
    }
    button:hover { background: var(--bg-hover); }
    button:disabled { cursor: not-allowed; opacity: 0.55; }

    #loginCard button, #uploadTriggerBtn {
      background: var(--accent); border-color: var(--accent); color: #0f1f28; font-weight: 600;
    }
    #loginCard button:hover, #uploadTriggerBtn:hover:not(:disabled) { background: #6bb0d8; }

    button.secondary { background: var(--bg-raised); border-color: var(--border); color: var(--text-muted); }
    button.secondary:hover { background: var(--bg-hover); color: var(--text); }
    button.danger { background: var(--danger-soft); border-color: var(--danger-soft); color: var(--danger); }
    button.danger:hover { background: rgba(226, 104, 95, 0.22); }

    a.admin-link { display: inline-block; margin-top: 4px; font-size: 0.78rem; color: var(--admin); text-decoration: none; }
    a.admin-link:hover { text-decoration: underline; }

    .hidden { display: none !important; }
    .info-text { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1.4rem; line-height: 1.5; }

    .dash-header {
      display: flex; justify-content: space-between; align-items: center;
      background: transparent; padding: 4px 2px 18px; border-bottom: 1px solid var(--border-soft);
      margin-bottom: 18px; gap: 12px;
    }
    .dash-header button { width: auto; }

    .nav-tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
    .nav-tabs button {
      width: auto; padding: 6px 12px; font-size: 0.85rem; background: transparent;
      border: 1px solid transparent; color: var(--text-muted); margin-top: 0; font-weight: 500;
    }
    .nav-tabs button:hover { background: var(--bg-hover); color: var(--text); }
    .nav-tabs button.active { background: var(--bg-raised); border-color: var(--border); color: var(--text); }

    /* 그룹 바 */
    .group-bar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-md);
      padding: 10px 14px; margin-bottom: 16px;
    }
    .group-bar .group-label { color: var(--text-muted); font-size: 0.82rem; white-space: nowrap; }
    .group-btn {
      width: auto; padding: 5px 12px; font-size: 0.8rem; margin-top: 0;
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    }
    .group-btn:hover { background: var(--bg-hover); color: var(--text); }
    .group-btn.active-group { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent-text); }
    .current-group-text { color: var(--text-faint); font-size: 0.8rem; font-weight: 500; margin-left: auto; }

    .modal-meta { text-align: left; background: var(--bg-input); border-radius: var(--r-sm); padding: 10px 14px; margin-bottom: 12px; font-size: 0.83rem; color: var(--text-muted); line-height: 1.6; }
    .modal-meta a { color: var(--accent-text); }

    /* 업로드 박스 및 프로그레스 바 */
    .upload-box {
      background: var(--bg-raised); padding: 18px; border-radius: var(--r-lg);
      border: 1px dashed var(--border); text-align: center; margin-bottom: 20px;
    }
    .progress-container { width: 100%; background: var(--bg-input); border-radius: var(--r-sm); overflow: hidden; margin-top: 10px; height: 8px; display: none; }
    .progress-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.1s; }

    /* 스마트폰 갤러리형 그리드 */
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
    .gallery-item {
      background: var(--bg-raised); border-radius: var(--r-md); overflow: hidden;
      border: 1px solid var(--border-soft); position: relative; cursor: pointer;
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s;
    }
    .gallery-item:hover { border-color: var(--border); }
    .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }
    .gallery-item .file-badge {
      position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.65);
      font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; color: #fff;
      max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* 폴더 보기 그리드 */
    .folder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .folder-card {
      background: var(--bg-raised); border: 1px solid var(--border-soft); border-radius: var(--r-md);
      padding: 18px 14px; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .folder-card:hover { border-color: var(--accent); background: var(--bg-hover); }
    .folder-card span { font-size: 2rem; display: block; margin-bottom: 8px; }
    .folder-card strong { font-size: 0.88rem; font-weight: 500; color: var(--text); }

    /* 모달 팝업 */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
    .modal-content { background: var(--bg-raised); padding: 18px; border-radius: var(--r-lg); max-width: 480px; width: 100%; border: 1px solid var(--border); text-align: center; position: relative; }
    .modal-content img, .modal-content video { max-width: 100%; max-height: 58vh; border-radius: var(--r-md); margin-bottom: 14px; }
    .modal-close { position: absolute; top: 8px; right: 12px; background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; width: auto; padding: 4px; margin-top: 0; }
    .modal-close:hover { color: var(--text); background: none; }

    #modalDownloadBtn, #modalDeleteBtn { width: auto; }

    /* 모바일 최적화 */
    @media (max-width: 480px) {
      #dashboard { padding: 14px 12px 50px; }
      .dash-header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .dash-header > button { width: 100%; }
      .current-group-text { margin-left: 0; width: 100%; }
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
      .card { max-width: 100%; padding: 1.75rem 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="card" id="loginCard">
    <h2>codetbase</h2>
    <p class="info-text">아이디와 비밀번호를 입력하여 로그인하세요.</p>
    <div class="input-group">
      <label>아이디</label>
      <input type="text" id="loginId" placeholder="예: user1">
    </div>
    <div class="input-group">
      <label>비밀번호</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button onclick="login()">로그인</button>
  </div>

  <div id="dashboard">
    <div class="dash-header">
      <div>
        <span class="badge" id="roleBadge">일반 사용자</span>
        <h3 id="welcomeText" style="font-size: 1.1rem; margin-top: 5px;">환영합니다</h3>
        <a href="admin.html" class="admin-link hidden" id="adminLink">👑 관리자 페이지로 이동 →</a>
      </div>
      <button class="secondary" style="width: auto; padding: 8px 16px;" onclick="logout()">로그아웃</button>
    </div>

    <div class="group-bar" id="groupBar">
      <span class="group-label">소속 그룹:</span>
      <div id="groupButtons" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
      <span class="current-group-text" id="currentGroupLabel"></span>
    </div>

    <div class="nav-tabs">
      <button id="tabAll" class="active" onclick="switchTab('all')">전체 파일 보기</button>
      <button id="tabFolders" onclick="switchTab('folders')">폴더별 보기</button>
    </div>

    <div class="upload-box">
      <p style="margin-bottom: 10px; color: #94a3b8; font-size: 0.9rem;">스마트폰 저장소로 보낼 파일을 선택하세요. (한 번에 최대 10개)</p>
      <input type="file" id="fileInput" multiple style="display: none;" onchange="uploadFile()">
      <button id="uploadTriggerBtn" onclick="document.getElementById('fileInput').click()" style="max-width: 200px; margin: 0 auto;">파일 선택 및 업로드</button>
      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p id="progressText" style="display:none; margin-top:6px; font-size:0.85rem; color:#38bdf8;"></p>
    </div>

    <div id="allFilesView">
      <div class="gallery-grid" id="galleryGrid"></div>
      <button id="loadMoreBtn" class="secondary" style="margin-top: 20px;" onclick="loadMoreFiles()">사진 더보기 +20</button>
    </div>

    <div id="foldersView" class="hidden">
      <div class="folder-grid" id="folderGrid"></div>
    </div>

    <div id="folderDetailView" class="hidden">
      <button class="secondary" style="width: auto; margin-bottom: 15px; padding: 6px 12px;" onclick="backToFolders()">← 폴더 목록으로</button>
      <h3 id="currentFolderName" style="margin-bottom: 15px; color: #38bdf8;"></h3>
      <div class="gallery-grid" id="folderGalleryGrid"></div>
    </div>
  </div>

  <div class="modal" id="fileModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModalDirect()">×</button>
      <div id="modalMediaContainer"></div>
      <p id="modalUploader" style="margin: 10px 0; font-size: 0.9rem; color: #94a3b8;"></p>
      <div class="modal-meta" id="modalMeta"></div>
      <div style="display: flex; gap: 10px;">
        <button id="modalDownloadBtn" style="flex: 1;" onclick="downloadCurrentFile()">저장 / 다운로드</button>
        <button id="modalDeleteBtn" class="danger hidden" onclick="deleteCurrentFile()" style="flex: 1;">삭제</button>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, query, orderBy, limit, startAfter, where
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import * as exifr from "https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.esm.mjs";

  // ⚠️ 이 파일(index.html)은 일반 사용자용입니다.
  // 계정 발급 / 그룹 생성-수정 / 서버 상태 확인 같은 관리자 기능은 여기 전혀 없습니다.
  // 그런 기능은 admin.html 에서만 다룹니다.

  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyCZiMuJmza3qBfzp-QLaLxolgFIXZPSUzU",
    authDomain: "codetbase-3afea.firebaseapp.com",
    projectId: "codetbase-3afea",
    storageBucket: "codetbase-3afea.firebasestorage.app",
    messagingSenderId: "560932432321",
    appId: "1:560932432321:web:94f0df7f19afa1db8d2740",
    measurementId: "G-EV5HXEE221"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 스마트폰 연결 주소는 Firestore(config/server 문서)에 저장해두고 여기서 불러옵니다.
  // 관리자 페이지(admin.html)에서 주소를 바꾸면 코드 재배포 없이 여기도 자동 반영됩니다.
  // 아래 값은 Firestore에 아직 아무 값도 없을 때만 쓰이는 비상용 기본값입니다.
  let PHONE_SERVER_URL = "https://carpentry-kitchen-crafter.ngrok-free.dev";

  async function loadServerUrlFromFirestore() {
    try {
      const snap = await getDoc(doc(db, "config", "server"));
      if (snap.exists() && snap.data().url) {
        PHONE_SERVER_URL = snap.data().url;
      }
    } catch (e) {
      console.error("서버 주소 로딩 실패, 기본값 사용:", e);
    }
  }
  const serverUrlReadyPromise = loadServerUrlFromFirestore();

  const DOMAIN = "@codetbase.com";
  const ADMIN_EMAILS = ["admin@codetbase.com", "admin"];

  let currentUser = null;
  let currentUserId = null;
  let isAdminGlobal = false; // 관리자 계정이면 파일을 그룹 구분 없이 전체 볼 수 있게 하기 위한 용도로만 사용 (관리 기능 아님)
  let allFilesData = [];
  let currentModalFile = null;
  let lastVisibleDoc = null;
  const PAGE_SIZE = 20;

  // 그룹 관련 상태
  let userGroups = [];       // 현재 로그인한 사용자가 소속된 그룹 목록
  let selectedGroup = null;  // 현재 화면에 선택되어 보여지고 있는 그룹

  // 그룹 정보(userGroups/selectedGroup)가 완전히 로딩될 때까지 업로드를 막기 위한 Promise
  // (로그인 직후 화면은 바로 뜨지만 그룹 정보는 비동기로 늦게 확정되기 때문에,
  //  이 Promise가 끝나기 전에 업로드하면 group 필드가 null로 잘못 저장되는 문제가 있었음)
  let groupsReady = false;
  let resolveGroupsReady;
  let groupsReadyPromise = new Promise((res) => { resolveGroupsReady = res; });

  // 로그인
  window.login = async () => {
    const rawId = document.getElementById('loginId').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    if (!rawId || !password) return alert("아이디와 비밀번호를 입력해주세요.");
    const email = rawId.includes('@') ? rawId : rawId + DOMAIN;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      alert("로그인 실패: 아이디 또는 비밀번호를 확인하세요.");
    }
  };

  window.logout = () => signOut(auth);

  // 로그인 상태 세션 관리
  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    if (user) {
      await serverUrlReadyPromise;
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      const userId = user.email.split('@')[0];
      currentUserId = userId;
      const isAdmin = ADMIN_EMAILS.includes(user.email) || ADMIN_EMAILS.includes(userId);
      isAdminGlobal = isAdmin;

      const badge = document.getElementById('roleBadge');
      if (isAdmin) {
        badge.innerText = "관리자";
        badge.className = "badge admin";
        document.getElementById('adminLink').classList.remove('hidden');
      } else {
        badge.innerText = "일반 사용자";
        badge.className = "badge";
        document.getElementById('adminLink').classList.add('hidden');
      }
      document.getElementById('welcomeText').innerText = `${userId} 님 환영합니다.`;

      // 그룹 정보를 다 불러오기 전에는 업로드를 막아서, group 필드가 null로 잘못 저장되는 것을 방지
      setUploadEnabled(false, '그룹 정보 불러오는 중...');
      await loadUserGroups(userId);
      setUploadEnabled(true);

      loadInitialFiles();
    } else {
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('dashboard').style.display = 'none';
    }
  });

  // 사용자가 소속된 그룹 불러오기
  async function loadUserGroups(userId) {
    const q = query(collection(db, "groups"), where("members", "array-contains", userId));
    const snap = await getDocs(q);
    userGroups = [];
    snap.forEach(d => userGroups.push({ id: d.id, ...d.data() }));

    selectedGroup = userGroups.length > 0 ? userGroups[0] : null;
    updateCurrentGroupLabel();
    renderGroupTabs();

    groupsReady = true;
    resolveGroupsReady();
  }

  // 업로드 버튼 활성/비활성 상태를 제어 (그룹 정보 로딩 중에는 비활성화)
  function setUploadEnabled(enabled, labelWhenDisabled) {
    const btn = document.getElementById('uploadTriggerBtn');
    if (!btn) return;
    btn.disabled = !enabled;
    btn.innerText = enabled ? '파일 선택 및 업로드' : (labelWhenDisabled || '불러오는 중...');
    btn.style.opacity = enabled ? '1' : '0.6';
    btn.style.cursor = enabled ? 'pointer' : 'not-allowed';
  }

  function updateCurrentGroupLabel() {
    const label = document.getElementById('currentGroupLabel');
    if (selectedGroup) {
      label.innerText = `현재 그룹: ${selectedGroup.name}`;
    } else {
      label.innerText = isAdminGlobal ? `현재 그룹: 전체 (관리자)` : `현재 그룹: 없음 (내 파일만 표시)`;
    }
  }

  function renderGroupTabs() {
    const container = document.getElementById('groupButtons');
    container.innerHTML = '';
    if (userGroups.length === 0) {
      const span = document.createElement('span');
      span.style.cssText = 'color:#64748b; font-size:0.85rem;';
      span.innerText = isAdminGlobal ? '관리자는 모든 파일을 볼 수 있습니다.' : '소속된 그룹이 없습니다 (내가 올린 파일만 표시됩니다)';
      container.appendChild(span);
      return;
    }
    userGroups.forEach(g => {
      const btn = document.createElement('button');
      btn.className = 'group-btn' + (selectedGroup && selectedGroup.id === g.id ? ' active-group' : '');
      btn.innerText = g.name;
      btn.onclick = () => selectGroup(g);
      container.appendChild(btn);
    });
  }

  window.selectGroup = (g) => {
    selectedGroup = g;
    updateCurrentGroupLabel();
    renderGroupTabs();
    loadInitialFiles();
    if (!document.getElementById('foldersView').classList.contains('hidden')) {
      loadFolders();
    }
  };

  // 사진 파일에서 촬영 기기(Make/Model)와 GPS 위치 정보를 읽어옴 (없으면 null)
  async function extractPhotoMeta(file) {
    let device = null;
    let gps = null;
    if (file.type && file.type.startsWith('image/')) {
      try {
        const data = await exifr.parse(file, { gps: true, tiff: true, ifd0: true });
        if (data) {
          const make = data.Make ? data.Make.trim() : '';
          const model = data.Model ? data.Model.trim() : '';
          const combined = `${make} ${model}`.trim();
          if (combined) device = combined;
          if (typeof data.latitude === 'number' && typeof data.longitude === 'number') {
            gps = { lat: data.latitude, lng: data.longitude };
          }
        }
      } catch (e) {
        console.warn('EXIF 정보를 읽을 수 없습니다:', e);
      }
    }
    return { device, gps };
  }

  // XMLHttpRequest를 Promise로 감싸서 실시간 업로드 진행률(%)을 받아옴
  // (fetch는 업로드 진행률 이벤트를 제공하지 않기 때문에 XHR을 사용)
  function uploadWithProgress(url, formData, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable && onProgress) {
          const percent = Math.round((e.loaded / e.total) * 100);
          onProgress(percent);
        }
      };

      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            resolve(JSON.parse(xhr.responseText));
          } catch (e) {
            reject(new Error('서버 응답을 해석할 수 없습니다.'));
          }
        } else {
          reject(new Error(`서버 응답 코드 ${xhr.status}`));
        }
      };

      xhr.onerror = () => reject(new Error('네트워크 오류로 업로드에 실패했습니다.'));

      xhr.send(formData);
    });
  }

  // 한 번에 업로드할 수 있는 최대 파일 개수
  const MAX_UPLOAD_COUNT = 10;

  // 파일 하나를 업로드 (폰 서버 전송 + Firestore 기록)
  async function uploadSingleFile(file) {
    const formData = new FormData();
    formData.append('file', file);

    // 사진에서 촬영 기기 / 위치 정보(EXIF) 추출
    const photoMeta = await extractPhotoMeta(file);

    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    const result = await uploadWithProgress(
      `${PHONE_SERVER_URL}/upload`,
      formData,
      (percent) => {
        progressBar.style.width = percent + '%';
      }
    );

    const savedName = result.name;
    const fileUrl = `${PHONE_SERVER_URL}/files/${encodeURIComponent(savedName)}`;

    await addDoc(collection(db, "files"), {
      name: savedName,
      url: fileUrl,
      uploader: currentUser.email.split('@')[0],
      group: selectedGroup ? selectedGroup.id : null,
      device: photoMeta.device,
      gps: photoMeta.gps,
      createdAt: Date.now()
    });
  }

  // 스마트폰 저장소(https)로 직접 파일 업로드 (여러 장 한 번에 최대 MAX_UPLOAD_COUNT개)
  window.uploadFile = async () => {
    const fileInput = document.getElementById('fileInput');
    let files = Array.from(fileInput.files || []);
    if (files.length === 0) return;

    if (files.length > MAX_UPLOAD_COUNT) {
      alert(`한 번에 최대 ${MAX_UPLOAD_COUNT}개까지만 업로드할 수 있습니다. 처음 ${MAX_UPLOAD_COUNT}개만 업로드합니다.`);
      files = files.slice(0, MAX_UPLOAD_COUNT);
    }

    // 그룹 정보(selectedGroup)가 아직 확정되지 않았다면 여기서 기다린다.
    // 이걸 안 하면 로그인 직후 빠르게 업로드했을 때 group이 null로 저장되어
    // "그룹 전체 파일 보기"와 "폴더별 보기" 어디에도 안 뜨는 문제가 생김.
    if (!groupsReady) {
      setUploadEnabled(false, '그룹 정보 확인 중...');
      await groupsReadyPromise;
      setUploadEnabled(true);
    }

    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    progressContainer.style.display = 'block';
    progressText.style.display = 'block';
    progressBar.style.width = '0%';

    setUploadEnabled(false, '업로드 중...');

    let successCount = 0;
    const failedNames = [];

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      progressText.innerText = `업로드 중... (${i + 1}/${files.length}) ${file.name}`;
      progressBar.style.width = '0%';
      try {
        await uploadSingleFile(file);
        successCount++;
      } catch (error) {
        console.error('업로드 실패:', file.name, error);
        failedNames.push(file.name);
      }
    }

    progressBar.style.width = '100%';
    progressText.innerText = '완료 처리 중...';

    if (failedNames.length === 0) {
      alert(`스마트폰 저장소로 파일 ${successCount}개 업로드가 완료되었습니다!`);
    } else {
      alert(`업로드 완료: 성공 ${successCount}개, 실패 ${failedNames.length}개\n실패한 파일: ${failedNames.join(', ')}\n(Termux에서 python server.py 창이 켜져 있는지, 터널이 켜져 있는지 확인하세요.)`);
    }

    loadInitialFiles();

    setUploadEnabled(true);
    setTimeout(() => {
      progressContainer.style.display = 'none';
      progressText.style.display = 'none';
      progressBar.style.width = '0%';
      progressText.innerText = '';
      fileInput.value = '';
    }, 500);
  };

  // 현재 상태(관리자 / 선택된 그룹 / 그룹 없음)에 맞는 파일 목록 쿼리를 구성
  function buildFilesQuery(afterDoc) {
    const base = collection(db, "files");
    if (isAdminGlobal) {
      return afterDoc
        ? query(base, orderBy("createdAt", "desc"), startAfter(afterDoc), limit(PAGE_SIZE))
        : query(base, orderBy("createdAt", "desc"), limit(PAGE_SIZE));
    } else if (selectedGroup) {
      return afterDoc
        ? query(base, where("group", "==", selectedGroup.id), orderBy("createdAt", "desc"), startAfter(afterDoc), limit(PAGE_SIZE))
        : query(base, where("group", "==", selectedGroup.id), orderBy("createdAt", "desc"), limit(PAGE_SIZE));
    } else {
      return afterDoc
        ? query(base, where("uploader", "==", currentUserId), orderBy("createdAt", "desc"), startAfter(afterDoc), limit(PAGE_SIZE))
        : query(base, where("uploader", "==", currentUserId), orderBy("createdAt", "desc"), limit(PAGE_SIZE));
    }
  }

  async function loadInitialFiles() {
    try {
      const q = buildFilesQuery(null);
      const querySnapshot = await getDocs(q);
      allFilesData = [];
      querySnapshot.forEach((docSnap) => {
        allFilesData.push({ id: docSnap.id, ...docSnap.data() });
      });
      lastVisibleDoc = querySnapshot.docs[querySnapshot.docs.length - 1] || null;
      renderGallery(allFilesData, 'galleryGrid');
    } catch (e) {
      console.error('파일 목록을 불러오지 못했습니다:', e);
      alert('파일 목록을 불러오지 못했습니다: ' + e.message + '\n(콘솔 로그에 Firestore 색인 생성 링크가 떴다면 그 링크를 눌러 색인을 만들어주세요.)');
    }
  }

  window.loadMoreFiles = async () => {
    if (!lastVisibleDoc) return alert("더 이상 불러올 파일이 없습니다.");
    try {
      const q = buildFilesQuery(lastVisibleDoc);
      const querySnapshot = await getDocs(q);
      if (querySnapshot.empty) {
        alert("모든 파일을 불러왔습니다.");
        return;
      }
      querySnapshot.forEach((docSnap) => {
        allFilesData.push({ id: docSnap.id, ...docSnap.data() });
      });
      lastVisibleDoc = querySnapshot.docs[querySnapshot.docs.length - 1] || null;
      renderGallery(allFilesData, 'galleryGrid');
    } catch (e) {
      console.error('파일을 더 불러오지 못했습니다:', e);
      alert('파일을 더 불러오지 못했습니다: ' + e.message);
    }
  };

  // 갤러리 그리드 출력
  function renderGallery(files, elementId) {
    const grid = document.getElementById(elementId);
    grid.innerHTML = '';
    files.forEach(file => {
      const item = document.createElement('div');
      item.className = 'gallery-item';

      const isVideo = file.name.match(/\.(mp4|webm|ogg|mov)$/i);
      if (isVideo) {
        item.innerHTML = `<video src="${file.url}"></video><div class="file-badge">${file.name}</div>`;
      } else {
        item.innerHTML = `<img src="${file.url}" loading="lazy"><div class="file-badge">${file.name}</div>`;
      }
      item.onclick = () => openModal(file);
      grid.appendChild(item);
    });
  }

  // 모달 팝업
  function openModal(file) {
    currentModalFile = file;
    const isVideo = file.name.match(/\.(mp4|webm|ogg|mov)$/i);
    const container = document.getElementById('modalMediaContainer');
    container.innerHTML = isVideo ? `<video src="${file.url}" controls autoplay></video>` : `<img src="${file.url}">`;

    document.getElementById('modalUploader').innerText = `올린 사람: ${file.uploader}`;

    const deviceText = file.device ? file.device : '기기 정보 없음';
    const gpsText = (file.gps && typeof file.gps.lat === 'number')
      ? `위도 ${file.gps.lat.toFixed(5)}, 경도 ${file.gps.lng.toFixed(5)} — <a href="https://maps.google.com/?q=${file.gps.lat},${file.gps.lng}" target="_blank" rel="noopener">지도에서 보기</a>`
      : '위치 정보 없음';
    document.getElementById('modalMeta').innerHTML = `
      📷 촬영 기기: ${deviceText}<br>
      📍 촬영 위치: ${gpsText}
    `;

    const userId = currentUser.email.split('@')[0];
    const isAdmin = ADMIN_EMAILS.includes(currentUser.email) || ADMIN_EMAILS.includes(userId);

    const deleteBtn = document.getElementById('modalDeleteBtn');
    if (file.uploader === userId || isAdmin) {
      deleteBtn.classList.remove('hidden');
    } else {
      deleteBtn.classList.add('hidden');
    }

    document.getElementById('fileModal').style.display = 'flex';
  }

  // 다운로드 버튼: 모바일에서는 공유 시트(사진 앱에 저장 가능)를, 컴퓨터에서는 파일로 저장을 시도
  window.downloadCurrentFile = () => {
    if (!currentModalFile) return;
    smartDownload(currentModalFile.url, currentModalFile.name);
  };

  async function smartDownload(url, filename) {
    try {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`파일을 불러올 수 없습니다 (${resp.status})`);
      const blob = await resp.blob();
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (isMobile && navigator.canShare) {
        try {
          const fileObj = new File([blob], filename, { type: blob.type });
          if (navigator.canShare({ files: [fileObj] })) {
            await navigator.share({ files: [fileObj] });
            return; // 공유 시트에서 "사진 앱에 저장"을 선택하면 갤러리에 저장됨
          }
        } catch (shareErr) {
          if (shareErr && shareErr.name === 'AbortError') return;
        }
      }

      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
    } catch (e) {
      alert('저장 실패: ' + e.message);
    }
  }

  window.closeModalDirect = () => { document.getElementById('fileModal').style.display = 'none'; };
  window.closeModal = (e) => { if (e.target.id === 'fileModal') closeModalDirect(); };

  // 삭제 기능
  window.deleteCurrentFile = async () => {
    if (!confirm("정말 삭제하시겠습니까? (폰에 저장된 실제 파일도 함께 삭제됩니다)")) return;
    const fileToDelete = currentModalFile;
    try {
      // 1) 폰(Termux 서버)에 실제 파일 삭제 요청
      //    서버가 꺼져있거나 삭제 라우트가 아직 없을 수도 있으니, 실패해도 목록 삭제는 계속 진행하고 사용자에게 알림만 띄운다.
      try {
        const delResp = await fetch(`${PHONE_SERVER_URL}/files/${encodeURIComponent(fileToDelete.name)}`, {
          method: 'DELETE'
        });
        if (!delResp.ok) {
          console.warn('폰 서버에서 파일 삭제 실패:', delResp.status);
          alert('주의: 폰에 저장된 실제 파일 삭제에는 실패했습니다 (서버 응답: ' + delResp.status + '). 목록에서는 삭제됩니다.');
        }
      } catch (phoneErr) {
        console.warn('폰 서버 삭제 요청 실패:', phoneErr);
        alert('주의: 폰 서버에 연결할 수 없어 실제 파일은 삭제되지 않았습니다 (Termux 서버/터널이 켜져 있는지 확인하세요). 목록에서는 삭제됩니다.');
      }

      // 2) Firestore 기록 삭제
      await deleteDoc(doc(db, "files", fileToDelete.id));
      closeModalDirect();
      loadInitialFiles();
    } catch (e) {
      alert("삭제 실패: " + e.message);
    }
  };

  // 탭 전환
  window.switchTab = (tab) => {
    document.getElementById('tabAll').classList.remove('active');
    document.getElementById('tabFolders').classList.remove('active');
    document.getElementById('allFilesView').classList.add('hidden');
    document.getElementById('foldersView').classList.add('hidden');
    document.getElementById('folderDetailView').classList.add('hidden');

    if (tab === 'all') {
      document.getElementById('tabAll').classList.add('active');
      document.getElementById('allFilesView').classList.remove('hidden');
    } else if (tab === 'folders') {
      document.getElementById('tabFolders').classList.add('active');
      document.getElementById('foldersView').classList.remove('hidden');
      loadFolders();
    }
  };

  // 폴더별 보기 (관리자: 전체 업로더 / 일반 사용자: 현재 선택된 그룹 소속 계정만)
  async function loadFolders() {
    let uploaders = new Set();

    try {
      if (isAdminGlobal) {
        const querySnapshot = await getDocs(collection(db, "files"));
        querySnapshot.forEach(docSnap => {
          const data = docSnap.data();
          if (data.uploader) uploaders.add(data.uploader);
        });
      } else if (selectedGroup) {
        uploaders = new Set(selectedGroup.members || []);
      } else {
        uploaders = new Set([currentUserId]);
      }
    } catch (e) {
      console.error('폴더 목록을 불러오지 못했습니다:', e);
      alert('폴더 목록을 불러오지 못했습니다: ' + e.message);
      return;
    }

    const folderGrid = document.getElementById('folderGrid');
    folderGrid.innerHTML = '';

    if (uploaders.size === 0) {
      folderGrid.innerHTML = '<p style="color:#94a3b8; grid-column: 1/-1; text-align: center;">업로드된 폴더가 없습니다.</p>';
      return;
    }

    uploaders.forEach(user => {
      const card = document.createElement('div');
      card.className = 'folder-card';
      card.innerHTML = `<span>📁</span><strong>${user}</strong>`;
      card.onclick = () => openFolder(user);
      folderGrid.appendChild(card);
    });
  }

  async function openFolder(username) {
    document.getElementById('foldersView').classList.add('hidden');
    document.getElementById('folderDetailView').classList.remove('hidden');
    document.getElementById('currentFolderName').innerText = `📁 ${username} 님의 폴더`;

    try {
      const constraints = [where("uploader", "==", username)];
      if (!isAdminGlobal && selectedGroup) {
        constraints.push(where("group", "==", selectedGroup.id));
      }
      const q = query(collection(db, "files"), ...constraints);
      const querySnapshot = await getDocs(q);
      const userFiles = [];
      querySnapshot.forEach(docSnap => {
        userFiles.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderGallery(userFiles, 'folderGalleryGrid');
    } catch (e) {
      console.error('폴더 파일을 불러오지 못했습니다:', e);
      alert('폴더 파일을 불러오지 못했습니다: ' + e.message);
    }
  }

  window.backToFolders = () => {
    document.getElementById('folderDetailView').classList.add('hidden');
    document.getElementById('foldersView').classList.remove('hidden');
  };
</script>

</body>
